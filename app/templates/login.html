{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Welcome back</h1>
  <p class="muted">Sign in to see your files.</p>

  {% if errors %}
    <div class="form-errors" role="alert">
      <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
    </div>
  {% endif %}

  <form method="post" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label class="field">
      <span>Username or email</span>
      <input type="text" name="identifier" value="{{ identifier }}" autocomplete="username" maxlength="254" required autofocus>
    </label>

    <label class="field">
      <span>Password</span>
      <div class="input-group">
        <input type="password" id="password" name="password" autocomplete="current-password" maxlength="128" required>
        <button class="pw-toggle" type="button" data-toggle-password="password">Show</button>
      </div>
    </label>

    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>

  <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
