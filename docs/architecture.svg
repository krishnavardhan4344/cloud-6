<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b4cca"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c2033">CloudStore - System Architecture</text>

  <!-- Client tier -->
  <rect x="30" y="60" width="240" height="440" rx="12" fill="#eef0f8" stroke="#3b4cca" stroke-width="2"/>
  <text x="150" y="88" text-anchor="middle" font-weight="bold" fill="#3b4cca">PRESENTATION TIER</text>
  <rect x="55" y="110" width="190" height="90" rx="8" fill="#fff" stroke="#9aa3d9"/>
  <text x="150" y="135" text-anchor="middle" font-weight="bold">Web Browser</text>
  <text x="150" y="157" text-anchor="middle" font-size="12">Desktop / tablet / phone</text>
  <text x="150" y="177" text-anchor="middle" font-size="12">Responsive UI</text>
  <rect x="55" y="220" width="190" height="130" rx="8" fill="#fff" stroke="#9aa3d9"/>
  <text x="150" y="245" text-anchor="middle" font-weight="bold">Front-end</text>
  <text x="150" y="268" text-anchor="middle" font-size="12">HTML5 templates (Jinja2)</text>
  <text x="150" y="288" text-anchor="middle" font-size="12">CSS3 (light / dark)</text>
  <text x="150" y="308" text-anchor="middle" font-size="12">JavaScript (fetch, XHR)</text>
  <text x="150" y="328" text-anchor="middle" font-size="12">drag-drop, progress, search</text>
  <rect x="55" y="370" width="190" height="105" rx="8" fill="#fff" stroke="#9aa3d9"/>
  <text x="150" y="395" text-anchor="middle" font-weight="bold">Browser security</text>
  <text x="150" y="418" text-anchor="middle" font-size="12">HttpOnly session cookie</text>
  <text x="150" y="438" text-anchor="middle" font-size="12">CSRF token header</text>
  <text x="150" y="458" text-anchor="middle" font-size="12">Content-Security-Policy</text>

  <!-- App tier -->
  <rect x="350" y="60" width="290" height="440" rx="12" fill="#eef0f8" stroke="#3b4cca" stroke-width="2"/>
  <text x="495" y="88" text-anchor="middle" font-weight="bold" fill="#3b4cca">APPLICATION TIER (Flask)</text>
  <rect x="375" y="110" width="240" height="80" rx="8" fill="#fff" stroke="#9aa3d9"/>
  <text x="495" y="135" text-anchor="middle" font-weight="bold">Request pipeline</text>
  <text x="495" y="157" text-anchor="middle" font-size="12">load user - CSRF check - handler</text>
  <text x="495" y="175" text-anchor="middle" font-size="12">security headers - error handlers</text>
  <rect x="375" y="210" width="240" height="105" rx="8" fill="#fff" stroke="#9aa3d9"/>
  <text x="495" y="235" text-anchor="middle" font-weight="bold">auth blueprint</text>
  <text x="495" y="257" text-anchor="middle" font-size="12">/register  /login  /logout</text>
  <text x="495" y="277" text-anchor="middle" font-size="12">password hashing (scrypt)</text>
  <text x="495" y="297" text-anchor="middle" font-size="12">login throttling</text>
  <rect x="375" y="335" width="240" height="140" rx="8" fill="#fff" stroke="#9aa3d9"/>
  <text x="495" y="360" text-anchor="middle" font-weight="bold">files blueprint</text>
  <text x="495" y="382" text-anchor="middle" font-size="12">GET  /dashboard</text>
  <text x="495" y="400" text-anchor="middle" font-size="12">GET / POST  /api/files</text>
  <text x="495" y="418" text-anchor="middle" font-size="12">GET  /api/files/&lt;id&gt;/download</text>
  <text x="495" y="436" text-anchor="middle" font-size="12">DELETE  /api/files/&lt;id&gt;</text>
  <text x="495" y="458" text-anchor="middle" font-size="12" fill="#c62f3e">every query filters by owner</text>

  <!-- Data tier -->
  <rect x="720" y="60" width="210" height="440" rx="12" fill="#eef0f8" stroke="#3b4cca" stroke-width="2"/>
  <text x="825" y="88" text-anchor="middle" font-weight="bold" fill="#3b4cca">DATA TIER</text>
  <rect x="740" y="115" width="170" height="165" rx="8" fill="#fff" stroke="#9aa3d9"/>
  <text x="825" y="140" text-anchor="middle" font-weight="bold">SQLite database</text>
  <text x="825" y="162" text-anchor="middle" font-size="12">users</text>
  <text x="825" y="180" text-anchor="middle" font-size="12">(id, username, email,</text>
  <text x="825" y="196" text-anchor="middle" font-size="12">password_hash)</text>
  <text x="825" y="220" text-anchor="middle" font-size="12">files</text>
  <text x="825" y="238" text-anchor="middle" font-size="12">(id, user_id, name, size,</text>
  <text x="825" y="254" text-anchor="middle" font-size="12">stored_name, uploaded_at)</text>
  <rect x="740" y="305" width="170" height="170" rx="8" fill="#fff" stroke="#9aa3d9"/>
  <text x="825" y="330" text-anchor="middle" font-weight="bold">File storage</text>
  <text x="825" y="354" text-anchor="middle" font-size="12">storage/</text>
  <text x="825" y="374" text-anchor="middle" font-size="12">  1/ 3f9a...  (user 1)</text>
  <text x="825" y="394" text-anchor="middle" font-size="12">  2/ b81c...  (user 2)</text>
  <text x="825" y="420" text-anchor="middle" font-size="12">random UUID names,</text>
  <text x="825" y="438" text-anchor="middle" font-size="12">one folder per user</text>

  <!-- Arrows -->
  <line x1="272" y1="200" x2="348" y2="200" stroke="#3b4cca" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="310" y="190" text-anchor="middle" font-size="12" fill="#3b4cca">HTTP(S)</text>
  <text x="310" y="218" text-anchor="middle" font-size="11" fill="#3b4cca">HTML/JSON</text>
  <line x1="642" y1="200" x2="718" y2="200" stroke="#3b4cca" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="680" y="190" text-anchor="middle" font-size="12" fill="#3b4cca">SQL</text>
  <line x1="642" y1="400" x2="718" y2="400" stroke="#3b4cca" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="680" y="390" text-anchor="middle" font-size="12" fill="#3b4cca">file I/O</text>

  <text x="480" y="535" text-anchor="middle" font-size="12" fill="#5d6480">No third-party cloud service or API key is required. Deploy the same app to any cloud VM / PaaS to make it internet-accessible.</text>
</svg>
